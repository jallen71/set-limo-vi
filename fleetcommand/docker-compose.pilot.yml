# Isolated pilot only: never point this stack at any SET production data.
name: fleetcommand-pilot
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: fleetcommand_pilot
      POSTGRES_USER: fc_admin
      POSTGRES_PASSWORD: ${FC_ADMIN_PASSWORD:?Isolated database password is required}
    volumes:
      - fleetcommand_pilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U fc_admin -d fleetcommand_pilot"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
    networks: [data]
  bootstrap:
    build: .
    command: ["node","admin/bootstrap.mjs"]
    environment:
      FLEETCOMMAND_ADMIN_ACK: ISOLATED_FLEETCOMMAND_DATABASE
      FLEETCOMMAND_ADMIN_DATABASE_URL: postgresql://fc_admin:${FC_ADMIN_PASSWORD}@database:5432/fleetcommand_pilot
      FC_AUTH_PASSWORD: ${FC_AUTH_PASSWORD:?Auth DB password required}
      FC_OPS_PASSWORD: ${FC_OPS_PASSWORD:?Operations DB password required}
      FC_RECOVERY_PASSWORD: ${FC_RECOVERY_PASSWORD:?Recovery DB password required}
    depends_on:
      database:
        condition: service_healthy
    networks: [data]
    restart: "no"
  invite-test-admin:
    profiles: [onboarding]
    build: .
    command: ["node","admin/invite-pilot.mjs"]
    environment:
      FLEETCOMMAND_ADMIN_DATABASE_URL: postgresql://fc_admin:${FC_ADMIN_PASSWORD}@database:5432/fleetcommand_pilot
      FLEETCOMMAND_RECOVERY_DATABASE_URL: postgresql://fc_recovery_app:${FC_RECOVERY_PASSWORD}@database:5432/fleetcommand_pilot
      FLEETCOMMAND_PILOT_INVITE_ACK: CREATE_ISOLATED_TEST_OPERATOR
      FLEETCOMMAND_PILOT_BUSINESS: FleetCommand Pilot
      FLEETCOMMAND_PILOT_EMAIL: testingthings@gmail.com
      FLEETCOMMAND_RESEND_API_KEY: ${FC_RESEND_API_KEY:?Email provider API key required}
      FLEETCOMMAND_MAIL_FROM: ${FC_VERIFIED_SENDER:?Verified email sender required}
      FLEETCOMMAND_MAIL_BASE_URL: https://${FC_PILOT_DOMAIN:?Pilot domain required}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [data]
    restart: "no"
  app:
    build: .
    environment:
      FLEETCOMMAND_DEV_ACK: ISOLATED_TEST_DATABASE
      FLEETCOMMAND_AUTH_DATABASE_URL: postgresql://fc_auth_app:${FC_AUTH_PASSWORD}@database:5432/fleetcommand_pilot
      FLEETCOMMAND_OPERATIONS_DATABASE_URL: postgresql://fc_ops_app:${FC_OPS_PASSWORD}@database:5432/fleetcommand_pilot
      FLEETCOMMAND_RECOVERY_DATABASE_URL: postgresql://fc_recovery_app:${FC_RECOVERY_PASSWORD}@database:5432/fleetcommand_pilot
      FLEETCOMMAND_DEV_PORT: "8788"
      FLEETCOMMAND_PILOT_BIND: 0.0.0.0
      FLEETCOMMAND_PILOT_PROXY_ACK: ISOLATED_REVERSE_PROXY
      FLEETCOMMAND_PUBLIC_ORIGIN: https://${FC_PILOT_DOMAIN:?Pilot staging domain required}
      FLEETCOMMAND_RECOVERY_EMAIL_ENABLED: ${FC_RECOVERY_EMAIL_ENABLED:-no}
      FLEETCOMMAND_RESEND_API_KEY: ${FC_RESEND_API_KEY:-}
      FLEETCOMMAND_MAIL_FROM: ${FC_VERIFIED_SENDER:-}
      FLEETCOMMAND_MAIL_BASE_URL: https://${FC_PILOT_DOMAIN}
      FLEETCOMMAND_MAIL_TEST_RECIPIENTS: testingthings@gmail.com
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [data,proxy]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80","443:443"]
    environment:
      FC_PILOT_DOMAIN: ${FC_PILOT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fleetcommand_caddy_data:/data
      - fleetcommand_caddy_config:/config
    depends_on: [app]
    networks: [proxy]
    restart: unless-stopped
networks:
  data:
    internal: true
  proxy: {}
volumes:
  fleetcommand_pilot_data: {}
  fleetcommand_caddy_data: {}
  fleetcommand_caddy_config: {}
