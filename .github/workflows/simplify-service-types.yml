name: Simplify Service Types

on:
  push:
    paths:
      - '.github/workflows/simplify-service-types.yml'

permissions:
  contents: write

jobs:
  update-service-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update service presentation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Reserved luxury van and driver service for multi-stop plans, business movement, dinners, and VIP needs. $600 includes up to 5 hours; additional time is $120 per hour. Reserved charter time runs continuously through final release.'
          new='Reserved transportation for extended service, multiple stops, waiting, and flexible itineraries.'
          assert old in s, 'Private Charter service description not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert '$600 includes up to 5 hours; additional time is $120 per hour. Reserved charter time runs continuously through final release.' not in s
          print('PRIVATE CHARTER SERVICE CARD: PASS')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Remove charter pricing from services card"
          git push