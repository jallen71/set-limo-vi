name: Update Terms Service Model

on:
  push:
    paths:
      - .github/workflows/update-terms-service-model.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/update_terms.py
      - run: |
          grep -q "Private Charter Service" terms.html
          grep -q "September 10, 2026" terms.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms.html
          git commit -m "Align terms with current transportation services"
          git push origin main
