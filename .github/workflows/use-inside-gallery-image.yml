name: Update Events Service Copy

on:
  push:
    paths:
      - '.github/workflows/use-inside-gallery-image.yml'

permissions:
  contents: write

jobs:
  update-events-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Events service wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>Private transportation for weddings, celebrations, corporate events, and planned special occasions.</p>'
          new = '<p>Private transportation for weddings, funerals, memorial services, and other occasions requiring dedicated transportation.</p>'
          assert old in s, 'Events service wording not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          assert new in s
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add funeral and memorial transportation to Events"
          git push origin main
