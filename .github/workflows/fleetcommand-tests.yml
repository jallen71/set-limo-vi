name: FleetCommand core tests
on:
  push:
    paths:
      - 'fleetcommand/**'
      - '.github/workflows/fleetcommand-tests.yml'
  pull_request:
    paths:
      - 'fleetcommand/**'
      - '.github/workflows/fleetcommand-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: fleetcommand
